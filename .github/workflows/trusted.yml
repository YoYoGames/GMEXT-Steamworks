# Builds and tests with the Steamworks SDK and a signed-in Steam client: on main, nightly, and for a pull request
# after a maintainer has reviewed it (dispatched on main with the PR number and the head SHA they reviewed).
#
# For now this checks the tier 3 runner, reports its build tools and builds Steamworks.dll. The steamworks-steam runner (tier 3) is in a runner group that accepts only this
# file on main, and GitHub only accepts a workflow for that list once the file is on main, so it lands first. The
# builds, tier 2 and tier 3 jobs follow.
name: trusted

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (empty to build main)
        required: false
        type: string
      sha:
        description: The pull request's head SHA that you reviewed
        required: false
        type: string

permissions:
  contents: read

jobs:
  steam-check:
    # Meant to be dispatched on main only. This only catches a mistake: a run from another branch uses that branch's
    # copy of this file, which can drop the check. What protects the runner is its group, which accepts only this file
    # on main; the secrets will be in an environment limited to main, set on the jobs that need them
    #
    # For now this only checks that the tier 3 runner is usable: the Steam client is running in the runner's session
    # and is signed in. It checks out no code. The builds, tier 2 and tier 3 jobs follow
    if: github.ref == 'refs/heads/main'
    # The runner was registered with --no-default-labels, so it has only this label; listing self-hosted as well would
    # leave the job queued forever
    runs-on: steamworks-steam
    timeout-minutes: 5
    steps:
      - name: Steam client is running and signed in
        # The runner machine's execution policy blocks scripts, and GitHub's built-in powershell shell dot-sources a
        # script file; Bypass applies to this process only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          # Only steam.exe in this job's session counts: the Steam API can't reach a client in another session, as
          # happens when the runner is a service (session 0) and Steam runs on the desktop
          $session = (Get-Process -Id $PID).SessionId
          if ($session -eq 0) { Write-Error 'The runner is running as a service (session 0); it must run in the signed-in desktop session' }
          $steam = Get-Process -Name steam -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session
          if (-not $steam) { Write-Error "steam.exe is not running in the runner's session ($session)" }
          Write-Host "steam.exe running in session $session (pid $($steam[0].Id))"
          # ActiveUser is the signed-in account's ID, 0 when nobody is signed in. Not printed: the log is public
          $active = (Get-ItemProperty 'HKCU:\Software\Valve\Steam\ActiveProcess' -ErrorAction SilentlyContinue).ActiveUser
          if (-not $active) { Write-Error 'Steam is running but nobody is signed in' }
          Write-Host 'Steam is signed in'
      - name: Build and test tools on the runner
        # Run even when the Steam check fails: the report doesn't depend on Steam
        if: ${{ !cancelled() }}
        # Reports what the tier 3 build and GameTest jobs can use: versions and yes/no only, since this log is public.
        # It doesn't fail the job; the jobs that need a tool fail clearly when it's missing
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          function Report($name, $value) { Write-Host ('{0,-34} {1}' -f $name, $value) }
          function Version($cmd, $arg) {
            $c = Get-Command $cmd -ErrorAction SilentlyContinue
            if (-not $c) { return 'not found' }
            try { return ((& $c.Source $arg 2>&1 | Select-Object -First 1) -as [string]).Trim() } catch { return 'found' }
          }
          Report 'git' (Version git --version)
          Report 'cmake' (Version cmake --version)
          Report 'ninja' (Version ninja --version)
          Report 'python' (Version python --version)
          Report 'dotnet' (Version dotnet --version)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion
            Report 'Visual Studio C++ tools' ($(if ($vs) { $vs } else { 'not found' }))
          } else { Report 'Visual Studio C++ tools' 'vswhere not found' }
          Report 'STEAMWORKS_SDK_ROOT set' ([bool]$env:STEAMWORKS_SDK_ROOT)
          if ($env:STEAMWORKS_SDK_ROOT) {
            Report 'STEAMWORKS_SDK_ROOT has steam_api.h' (Test-Path (Join-Path $env:STEAMWORKS_SDK_ROOT 'public\steam\steam_api.h'))
          }
          Report 'GMRT_ROOT set' ([bool]$env:GMRT_ROOT)
          if ($env:GMRT_ROOT) {
            Report 'GMRT_ROOT has gmrt.exe' ([bool](Get-ChildItem $env:GMRT_ROOT -Recurse -Filter gmrt.exe -ErrorAction SilentlyContinue | Select-Object -First 1))
          }
          Report 'gmrt on PATH' ([bool](Get-Command gmrt -ErrorAction SilentlyContinue))

  windows-build:
    # Builds Steamworks.dll from main, or from a reviewed pull request at the SHA given. Runs on the tier 3 runner
    # because that's the trusted Windows machine with Visual Studio; GameTest specs that need Steam follow once the
    # runner has a GMRT build. Only same-repository pull requests: this machine is signed in to Steam
    if: github.ref == 'refs/heads/main'
    needs: steam-check
    runs-on: steamworks-steam
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # to read the pull request's head repository and SHA
    steps:
      - name: Choose the commit to build
        id: target
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PR) {
            if ($env:SHA) { Write-Error 'sha is only used with pr' }
            "ref=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "label=main" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          if ($env:PR -notmatch '^[0-9]+$') { Write-Error 'pr must be a pull request number' }
          if ($env:SHA -notmatch '^[0-9a-f]{40}$') { Write-Error 'sha must be the full 40-character head SHA you reviewed' }
          $pr = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/$env:PR"
          if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) {
            Write-Error 'Only pull requests from this repository can run on the tier 3 runner'
          }
          if ($pr.head.sha -ne $env:SHA) {
            Write-Error "The pull request's head is now $($pr.head.sha), not the SHA given; review the new commits and dispatch again"
          }
          "ref=$env:SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "label=pr-$env:PR" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - name: Checked out the commit chosen
        # actions/checkout falls back to github.sha when ref is empty, so a pull request's artifact could silently be main
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          EXPECTED: ${{ inputs.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED) { Write-Error "Checked out $head, expected $env:EXPECTED" }
          Write-Host "Building $head"

      - name: Get Steamworks SDK 1.65
        # From the private YoYoGames/steamworks-sdk with its read-only deploy key; the key file is deleted afterwards
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          SDK_KEY: ${{ secrets.STEAMWORKS_SDK_SSH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SDK_KEY) { Write-Error 'STEAMWORKS_SDK_SSH_KEY is not set' }
          # RUNNER_TEMP isn't always emptied between jobs: remove any key file an earlier run left behind. Each run's
          # files have their own names, and the key file stays deletable by the runner's account
          Get-ChildItem $env:RUNNER_TEMP -Filter 'steamworks_sdk_key*' -ErrorAction SilentlyContinue | ForEach-Object {
            icacls $_.FullName /reset | Out-Null
            Remove-Item -Force $_.FullName
          }
          $suffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $key = Join-Path $env:RUNNER_TEMP "steamworks_sdk_key-$suffix"
          $known = Join-Path $env:RUNNER_TEMP "steamworks_sdk_known_hosts-$suffix"
          $sdk = Join-Path $env:RUNNER_TEMP 'steamworks-sdk'
          try {
            [IO.File]::WriteAllText($key, ($env:SDK_KEY -replace "`r", '') + "`n")
            # readable and deletable by the runner's account only (ssh refuses a key file others can read)
            icacls $key /inheritance:r /grant:r "$($env:USERNAME):(R,D)" | Out-Null
            # github.com's published host keys, fetched over HTTPS, so a spoofed host can't serve a different SDK
            $meta = Invoke-RestMethod -Uri 'https://api.github.com/meta'
            [IO.File]::WriteAllLines($known, ($meta.ssh_keys | ForEach-Object { "github.com $_" }))
            $env:GIT_SSH_COMMAND = "ssh -i `"$key`" -o IdentitiesOnly=yes -o UserKnownHostsFile=`"$known`" -o StrictHostKeyChecking=yes"
            if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
            git clone --quiet --depth 1 --branch 1.65 git@github.com:YoYoGames/steamworks-sdk.git $sdk
            if ($LASTEXITCODE -ne 0) { Write-Error 'Cloning the SDK failed' }
          } finally {
            Remove-Item -Force $key, $known -ErrorAction SilentlyContinue
            if (Test-Path $key) { Write-Error 'The SDK key file could not be removed from RUNNER_TEMP' }
          }
          $root = Get-ChildItem $sdk -Recurse -Filter steam_api.h | Where-Object { $_.Directory.Name -eq 'steam' } | Select-Object -First 1
          if (-not $root) { Write-Error 'public/steam/steam_api.h not found in the SDK' }
          $sdkRoot = $root.Directory.Parent.Parent.FullName
          "STEAMWORKS_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'SDK ready'

      - name: Build Steamworks.dll (win-x64-release)
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: source/Steamworks_gml/extensions/Steamworks/source
        run: |
          $ErrorActionPreference = 'Stop'
          # Steamworks.dll is committed; remove it so the checks below can only see the one this build makes
          Remove-Item -Force ../Steamworks.dll -ErrorAction SilentlyContinue
          cmake --preset win-x64-release "-DSTEAMWORKS_SDK_ROOT=$env:STEAMWORKS_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) { Write-Error 'configure failed' }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { Write-Error 'build failed' }

      - name: Check the exports
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'source/Steamworks_gml/extensions/Steamworks/Steamworks.dll'
          $built = Get-ChildItem 'source/Steamworks_gml/extensions/Steamworks/source/out/build/win-x64-release' -Recurse -Filter Steamworks.dll |
            Where-Object { $_.Directory.Name -eq 'Release' } | Select-Object -First 1
          if (-not $built) { Write-Error 'No Release/Steamworks.dll in the build directory' }
          if (-not (Test-Path $dll)) { Write-Error "The build didn't copy Steamworks.dll to the extension folder" }
          if ((Get-FileHash $dll).Hash -ne (Get-FileHash $built.FullName).Hash) { Write-Error "$dll isn't the DLL this build made" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $exports = (& $dumpbin /nologo /exports $dll | Select-String '__EXT_NATIVE__').Count
          $declared = (Select-String -Path 'source/Steamworks_gml/extensions/Steamworks/Steamworks.yy' -Pattern '"externalName": "__EXT_NATIVE__').Count
          Write-Host "Steamworks.dll exports $exports __EXT_NATIVE__ functions; Steamworks.yy declares $declared"
          if ($exports -ne $declared) { Write-Error 'The export count does not match the functions Steamworks.yy declares' }

      - name: Upload Steamworks.dll
        uses: actions/upload-artifact@v4
        with:
          name: Steamworks-windows-${{ steps.target.outputs.label }}
          path: source/Steamworks_gml/extensions/Steamworks/Steamworks.dll
          if-no-files-found: error

